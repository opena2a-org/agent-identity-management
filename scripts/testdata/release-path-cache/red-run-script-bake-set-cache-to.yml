# Refused: a bake cache override given on the command line.
name: fixture

on:
  push:
    tags:
      - 'platform-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bake images
        run: docker buildx bake --set '*.cache-to=type=gha,mode=max' --load
