# Refused: `tags-ignore` leaves every other tag able to start the run.
name: fixture

on:
  push:
    tags-ignore:
      - 'nightly-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0000000000000000000000000000000000000000 # fixture
        with:
          path: ~/.npm
          key: npm
