# Refused: actions/cache restores in a tag-only job.
name: fixture

on:
  push:
    tags:
      - 'platform-v*'
    branches:
      - main

permissions:
  contents: read

jobs:
  sbom:
    if: startsWith(github.ref, 'refs/tags/platform-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0000000000000000000000000000000000000000 # fixture
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
