# Refused: setup-qemu-action restores its binfmt image from the Actions cache unless `cache-image: false` is set.
name: fixture

on:
  push:
    tags:
      - 'platform-v*'

permissions:
  contents: read

jobs:
  build-backend:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/platform-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 # qemu-v10.2.3
