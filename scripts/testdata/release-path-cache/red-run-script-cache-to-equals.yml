# Refused: a build cache exported from a run script with `--cache-to=`, in a step
# whose `if:` the lint cannot decide (a step output), so it is read.
name: fixture

on:
  push:
    tags:
      - 'platform-v*'

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/platform-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: idempotence
        run: echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.idempotence.outputs.skip != 'true'
        run: |
          docker buildx build --cache-to=type=registry,ref=ghcr.io/example/cache,mode=max --load .
