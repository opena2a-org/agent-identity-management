# Refused: `?` makes the character before it optional, so the tag `rc` matches
# `rc1?` and this job runs for it.
name: fixture

on:
  push:
    tags:
      - 'rc1?'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref_name == 'rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0000000000000000000000000000000000000000 # fixture
        with:
          path: ~/.npm
          key: npm
