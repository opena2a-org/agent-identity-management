# Refused: setup-go turns its cache off only with `cache: false`; an empty value is
# not `false`.
name: fixture

on:
  push:
    tags:
      - 'platform-v*'

permissions:
  contents: read

jobs:
  sbom:
    if: startsWith(github.ref, 'refs/tags/platform-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/backend/go.mod
          cache: ""
