# Refused: a push filtered only by `paths` has no branch or tag filter, and path
# filters are not evaluated for tag pushes, so it runs for every tag.
name: fixture

on:
  push:
    paths:
      - 'apps/backend/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0000000000000000000000000000000000000000 # fixture
        with:
          path: ~/.npm
          key: npm
