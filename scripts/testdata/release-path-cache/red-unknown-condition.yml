# Refused: the lint cannot decide `inputs.publish`, and a condition it cannot decide
# keeps the job on the release path.
name: fixture

on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0000000000000000000000000000000000000000 # fixture
        with:
          path: ~/.npm
          key: npm
