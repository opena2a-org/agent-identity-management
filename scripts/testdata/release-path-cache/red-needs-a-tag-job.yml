# Refused: `attach` has no `if:` of its own; it is on the release path because the
# job it needs is.
name: fixture

on:
  push:
    tags:
      - 'platform-v*'
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/platform-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make dist

  attach:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
