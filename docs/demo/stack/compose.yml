# The recording stack: the services of docker-compose.quickstart.yml with the
# images pinned by digest (stack/images.env), plus a loopback forwarder (gw) and
# the two recorders. Nothing is published on the host and no container has a
# fixed name: render.sh always runs this file with `-p aimdemo-<utc-stamp>`,
# so it can never collide with a quickstart stack on the same machine.
#
# The terminal and browser containers share gw's network namespace, so inside
# them `localhost:3000` is the dashboard and `localhost:8080` is the API, the
# addresses the README uses.
services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by render.sh}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # over TCP, not the socket: the image's init phase answers on the socket
      # and then restarts, and the released backend does not retry a refused connection
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d identity"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE}
    command: redis-server --requirepass ${REDIS_PASSWORD:?generated by render.sh}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ${AIM_SERVER_IMAGE}
    restart: on-failure:5
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=identity
      - POSTGRES_SSL_MODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?generated by render.sh}
      - KEYVAULT_MASTER_KEY=${KEYVAULT_MASTER_KEY:?generated by render.sh}
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000
      - ENVIRONMENT=development
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?generated by render.sh}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 24

  frontend:
    image: ${AIM_DASHBOARD_IMAGE}
    restart: on-failure:5
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:3000"]
      interval: 5s
      timeout: 5s
      retries: 24

  gw:
    build:
      context: ../browser
    command: ["node", "/work/lib/gw.mjs"]
    volumes:
      - ../lib:/work/lib:ro
    depends_on:
      frontend:
        condition: service_healthy

  terminal:
    build:
      context: ../terminal
      args:
        BASE_IMAGE: ${VHS_BASE_IMAGE}
    network_mode: "service:gw"
    shm_size: 1g
    working_dir: /work/out
    environment:
      - DEMO_SLUG=${DEMO_SLUG}
      - DEMO_REHEARSAL=${DEMO_REHEARSAL:-0}
      # the SDK's login opens the device page with the webbrowser module; inside the
      # recorder that must be a no-op, or a browser process starves the frame capture
      - BROWSER=/bin/true
    volumes:
      - ${DEMO_OUT}:/work/out
      - ../${DEMO_SLUG}:/work/scene:ro
      - ../../../sdk/python:/work/sdk:ro
      - ../lib:/work/lib:ro
    depends_on:
      - gw

  browser:
    build:
      context: ../browser
    command: ["node", "/work/scene/walkthrough.mjs"]
    network_mode: "service:gw"
    shm_size: 1g
    environment:
      - DEMO_SLUG=${DEMO_SLUG}
      - DEMO_RUN_ENV=/work/run/.env
    volumes:
      - ${DEMO_OUT}:/work/out
      - ${DEMO_RUN}:/work/run:ro
      - ../${DEMO_SLUG}:/work/scene:ro
      - ../lib:/work/lib:ro
    depends_on:
      - gw

volumes:
  postgres_data:
