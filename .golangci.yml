# golangci-lint configuration for AIM (v2 schema).
# Security-focused linting with gosec in audit mode.
# Migrated from v1 on 2026-06-26 (`golangci-lint migrate`); govet/staticcheck/unused are
# enabled by default in v2 so they no longer need an explicit `enable` entry. gosimple was
# folded into staticcheck and typecheck is no longer a togglable linter.
version: "2"
run:
  modules-download-mode: readonly
output:
  formats:
    text:
      path: stdout
  sort-order:
    - linter
    - severity
    - file
linters:
  enable:
    # Security
    - gosec
    - bodyclose
    - sqlclosecheck
  disable:
    - errcheck    # Widespread unchecked returns — enable incrementally
    - ineffassign # Pre-existing ineffectual assignments — fix in code cleanup PR
    - misspell    # Pre-existing misspellings — fix in code cleanup PR
  settings:
    gosec:
      # Audit mode: report all issues without filtering.
      config:
        global:
          audit: true
      excludes:
        - G101  # Hardcoded credentials in tests
        - G115  # Integer overflow int->int32 (low risk, noisy)
        - G201  # SQL string formatting (pre-existing, uses parameterized queries)
        - G402  # TLS MinVersion (SMTP email service, tracked separately)
        - G118  # context.Background in goroutines: our fire-and-forget background
                # tasks (capability detection, anomaly detection, liveness, expiry)
                # MUST outlive the request, so detaching from the request ctx is
                # intentional. Style/observability rule, not a vuln class; excluded
                # repo-wide because the pattern recurs. (G117 is suppressed per-site
                # at the one legitimate token-bundle site; G204/G304 stay active.)
      severity: medium
      confidence: medium
    govet:
      enable-all: false
    misspell:
      locale: US
  exclusions:
    generated: lax
    # NOTE: golangci-lint's `common-false-positives` preset disables gosec
    # EXC0007 (G204, subprocess with variable) and EXC0010 (G304, file inclusion
    # via variable) repo-wide. For a security gate that is intentionally omitted —
    # those injection classes must stay enforced. Legitimate single sites are
    # suppressed per-line with //nolint:gosec and a rationale instead.
    presets:
      - comments
      - legacy
      - std-error-handling
    rules:
      # Allow unused params in interface implementations
      - linters:
          - unused
        source: '^func \(.*\) '
      # Relax security checks in test files
      - linters:
          - bodyclose
          - gosec
        path: _test\.go
      # Integration test helpers (e.g. tests/integration/test_helper.go) aren't
      # named *_test.go but are test infra. The bodyclose hits here are false
      # positives: the shared Request helper reads and closes the body itself.
      - linters:
          - bodyclose
        path: tests/integration/
      # CLI entrypoints — interactive prompts, bootstrapping
      - linters:
          - gosec
        path: cmd/
    paths:
      - vendor
      - testdata
      - node_modules
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
