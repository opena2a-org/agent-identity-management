version: '3.9'

# Host ports and container names come from the environment (or .env), with
# these defaults:
#   AIM_POSTGRES_PORT=5432  AIM_REDIS_PORT=6379  AIM_BACKEND_PORT=8080  AIM_FRONTEND_PORT=3000
#   AIM_ELASTICSEARCH_PORT=9200  AIM_ELASTICSEARCH_TRANSPORT_PORT=9300
#   AIM_MINIO_PORT=9000  AIM_MINIO_CONSOLE_PORT=9001
#   AIM_NATS_PORT=4222  AIM_NATS_MONITOR_PORT=8222
#   AIM_PROMETHEUS_PORT=9090  AIM_GRAFANA_PORT=3003  AIM_LOKI_PORT=3100
#   AIM_PROJECT=aim   (prefix of every container name: aim-postgres, aim-backend, ...)
# The first five are the quick-start's variables, with the same defaults.
# Compose names the volumes and the network after its project, which is
# COMPOSE_PROJECT_NAME when set and otherwise this file's directory. This stack
# runs beside a quick-start or a second checkout on one host when each has its
# own project, AIM_PROJECT and ports.

services:
  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ${AIM_PROJECT:-aim}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${AIM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ${AIM_PROJECT:-aim}-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
    ports:
      - "127.0.0.1:${AIM_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Elasticsearch for audit logs and search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: ${AIM_PROJECT:-aim}-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${AIM_ELASTICSEARCH_PORT:-9200}:9200"
      - "127.0.0.1:${AIM_ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aim-network

  # MinIO for object storage (certificates, documents)
  minio:
    image: minio/minio:latest
    container_name: ${AIM_PROJECT:-aim}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aim_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
    ports:
      - "127.0.0.1:${AIM_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${AIM_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aim-network

  # NATS JetStream for messaging
  nats:
    image: nats:2-alpine
    container_name: ${AIM_PROJECT:-aim}-nats
    command: "--jetstream --store_dir=/data"
    ports:
      - "127.0.0.1:${AIM_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${AIM_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: ${AIM_PROJECT:-aim}-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "127.0.0.1:${AIM_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    # The backend's metrics token, mounted at /run/secrets/metrics_auth_token
    # and named by credentials_file in prometheus.yml.
    secrets:
      - metrics_auth_token
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: ${AIM_PROJECT:-aim}-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:${AIM_GRAFANA_PORT:-3003}
    ports:
      - "127.0.0.1:${AIM_GRAFANA_PORT:-3003}:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Loki for log aggregation
  loki:
    image: grafana/loki:latest
    container_name: ${AIM_PROJECT:-aim}-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:${AIM_LOKI_PORT:-3100}:3100"
    volumes:
      - ./infrastructure/monitoring/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Promtail for log collection
  promtail:
    image: grafana/promtail:latest
    container_name: ${AIM_PROJECT:-aim}-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infrastructure/monitoring/promtail.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - promtail_data:/promtail
    depends_on:
      - loki
    networks:
      - aim-network

  # Backend API Service
  backend:
    image: ghcr.io/opena2a-org/aim-server:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: ${AIM_PROJECT:-aim}-backend
    environment:
      # Database Configuration (connects to postgres service)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      - POSTGRES_DB=${POSTGRES_DB:-identity}
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE:-disable}
      # Redis Configuration (connects to redis service)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      # Security Configuration
      # No fallback defaults: known-bad secrets in source defeat their own blocklist (CWE-798).
      # Generate fresh values with ./scripts/gen-dev-secrets.sh (writes to stdout; redirect to .env).
      # The backend refuses to start when these are set to any known development default,
      # in every environment (not only production) — see apps/backend/internal/config/config.go.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      - KEYVAULT_MASTER_KEY=${KEYVAULT_MASTER_KEY:?Set KEYVAULT_MASTER_KEY in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      # Metrics: /metrics is served on its own listener, not on port 8080. It
      # listens on all interfaces inside the container so Prometheus reaches
      # backend:9464 over aim-network; 9464 is not published to the host. Off
      # loopback the listener requires METRICS_AUTH_TOKEN (32+ characters),
      # which Prometheus presents from the metrics_auth_token secret.
      - METRICS_LISTEN_ADDR=0.0.0.0:9464
      - METRICS_AUTH_TOKEN=${METRICS_AUTH_TOKEN:?Set METRICS_AUTH_TOKEN in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one, or openssl rand -hex 32)}
      # Server signing keys (optional): a base64 32-byte Ed25519 seed per purpose. Unset, each
      # key is derived from KEYVAULT_MASTER_KEY. Provision both in production; see
      # docs/DEPLOYMENT.md "Server Signing Keys". The _RETIRED variables list the public
      # keys that still verify after a rotation (comma-separated).
      - AIM_SIGNING_KEY_CARD_ATTESTATION=${AIM_SIGNING_KEY_CARD_ATTESTATION:-}
      - AIM_SIGNING_KEY_ATC_ISSUER=${AIM_SIGNING_KEY_ATC_ISSUER:-}
      - AIM_SIGNING_KEY_CARD_ATTESTATION_RETIRED=${AIM_SIGNING_KEY_CARD_ATTESTATION_RETIRED:-}
      - AIM_SIGNING_KEY_ATC_ISSUER_RETIRED=${AIM_SIGNING_KEY_ATC_ISSUER_RETIRED:-}
      # Email Configuration (optional - platform works without email)
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@localhost}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      # Frontend URL for CORS and links; by default they follow the dashboard's host port.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:${AIM_FRONTEND_PORT:-3000}}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:${AIM_FRONTEND_PORT:-3000}}
      # Admin user configuration (optional). ADMIN_PASSWORD seeds the first administrator
      # (ADMIN_EMAIL) only while no administrator exists; it never changes an existing password.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@opena2a.org}
      # Comma-separated emails approved automatically at sign-up; they become the first administrators.
      - AIM_PLATFORM_ADMINS=${AIM_PLATFORM_ADMINS:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # DEFAULT_ADMIN_PASSWORD is not set here: only the one-shot bootstrap
      # service below reads it, so it is not kept in this container's environment.
      # Environment (defaults to development for docker-compose; set ENVIRONMENT=production for production)
      - ENVIRONMENT=${ENVIRONMENT:-development}
    ports:
      - "${AIM_BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aim-network

  # One-shot admin bootstrap: `docker compose run --rm bootstrap` once the
  # backend is healthy (it applies the migrations at startup). Creates
  # admin@opena2a.org and exits; later runs change nothing. The password is
  # DEFAULT_ADMIN_PASSWORD from .env (./scripts/gen-dev-secrets.sh emits one) and
  # is not printed. If it is unset, bootstrap generates a password and prints it
  # once. The profile keeps this service out of `docker compose up`.
  # aim-bootstrap reads the database from the same POSTGRES_* variables as the
  # backend, so any character in POSTGRES_PASSWORD reaches PostgreSQL
  # unchanged. When POSTGRES_HOST is set it does not read DATABASE_URL, which
  # is here for the aim-bootstrap of platform-v1.0.0: that one reads only
  # DATABASE_URL, where a single quote or a backslash in the password breaks
  # the connection string.
  bootstrap:
    image: ghcr.io/opena2a-org/aim-server:latest
    profiles: ["bootstrap"]
    entrypoint: ["/app/aim-bootstrap"]
    command: ["--default"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      - POSTGRES_DB=${POSTGRES_DB:-identity}
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE:-disable}
      - DATABASE_URL=host=postgres port=5432 user=${POSTGRES_USER:-postgres} password='${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}' dbname=${POSTGRES_DB:-identity} sslmode=${POSTGRES_SSL_MODE:-disable}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    networks:
      - aim-network

  # Frontend Web Application
  frontend:
    image: ghcr.io/opena2a-org/aim-dashboard:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: ${AIM_PROJECT:-aim}-frontend
    environment:
      # The URL the browser reaches the API at; the dashboard hands it to the browser each
      # time it renders a page. It follows the backend's host port unless FRONTEND_API_URL
      # is set, which a dashboard opened from another machine or behind a reverse proxy
      # needs (docs/DEPLOYMENT.md, Enable HTTPS).
      - NEXT_PUBLIC_API_URL=${FRONTEND_API_URL:-http://localhost:${AIM_BACKEND_PORT:-8080}}
      - NODE_ENV=production
    ports:
      - "${AIM_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aim-network

# Secrets mounted as files under /run/secrets/, each read from an environment
# variable (.env), never from a tracked file.
secrets:
  metrics_auth_token:
    environment: METRICS_AUTH_TOKEN

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  minio_data:
  nats_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:

networks:
  aim-network:
    driver: bridge
