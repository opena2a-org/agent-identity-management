version: '3.9'

services:
  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aim-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aim-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Elasticsearch for audit logs and search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: aim-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aim-network

  # MinIO for object storage (certificates, documents)
  minio:
    image: minio/minio:latest
    container_name: aim-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aim_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aim-network

  # NATS JetStream for messaging
  nats:
    image: nats:2-alpine
    container_name: aim-nats
    command: "--jetstream --store_dir=/data"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: aim-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: aim-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3003
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Loki for log aggregation
  loki:
    image: grafana/loki:latest
    container_name: aim-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infrastructure/monitoring/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Promtail for log collection
  promtail:
    image: grafana/promtail:latest
    container_name: aim-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infrastructure/monitoring/promtail.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - promtail_data:/promtail
    depends_on:
      - loki
    networks:
      - aim-network

  # Backend API Service
  backend:
    image: ghcr.io/opena2a-org/aim-server:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: aim-backend
    environment:
      # Database Configuration (connects to postgres service)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      - POSTGRES_DB=${POSTGRES_DB:-identity}
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE:-disable}
      # Redis Configuration (connects to redis service)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      # Security Configuration
      # No fallback defaults: known-bad secrets in source defeat their own blocklist (CWE-798).
      # Generate fresh values with ./scripts/gen-dev-secrets.sh (writes to stdout; redirect to .env).
      # The backend refuses to start when these are set to any known development default,
      # in every environment (not only production) — see apps/backend/internal/config/config.go.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      - KEYVAULT_MASTER_KEY=${KEYVAULT_MASTER_KEY:?Set KEYVAULT_MASTER_KEY in .env (run ./scripts/gen-dev-secrets.sh > .env to generate one)}
      # Email Configuration (optional - platform works without email)
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@localhost}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      # Frontend URL for CORS and links
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      # Admin user configuration (optional - override default admin password)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@opena2a.org}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # DEFAULT_ADMIN_PASSWORD is read by `aim-bootstrap --default` inside the
      # container so operators can pre-set the canonical admin password via
      # .env (./scripts/gen-dev-secrets.sh emits one). If unset, bootstrap
      # generates a random password and prints it once to stdout. Optional.
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}
      # Environment (defaults to development for docker-compose; set ENVIRONMENT=production for production)
      - ENVIRONMENT=${ENVIRONMENT:-development}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aim-network

  # Frontend Web Application
  frontend:
    image: ghcr.io/opena2a-org/aim-dashboard:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: aim-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aim-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  minio_data:
  nats_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:

networks:
  aim-network:
    driver: bridge
