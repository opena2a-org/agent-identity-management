# Simplified Docker Compose for AIM
# Run with: docker compose -f docker-compose.simple.yml up
#
# This is a minimal setup that runs just the core services:
# - PostgreSQL database
# - Redis cache
# - Backend API
# - Frontend UI
#
# All defaults are configured - just run `docker compose -f docker-compose.simple.yml up`

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aim-postgres
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: aim-backend
    environment:
      # Database - connects to postgres service
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=identity
      - POSTGRES_SSL_MODE=disable
      # Redis - connects to redis service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Security - defaults provided, override for production
      - JWT_SECRET=${JWT_SECRET:-pR1fz62Vd+uDpfdXOzZRx5XXbwsFIbyxhwHZmbRqGmk=}
      - KEYVAULT_MASTER_KEY=${KEYVAULT_MASTER_KEY:-YsOb1gouG02SWoGY3v7VfnuGlSc6zI3f0IWjLbeVw+w=}
      # Frontend URL for CORS
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000
      # Environment
      - ENVIRONMENT=production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aim-network

  # Frontend Web Application
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: aim-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aim-network

volumes:
  postgres_data:
  redis_data:

networks:
  aim-network:
    driver: bridge
