# AIM Quickstart — run without cloning the repo
#
# Usage:
#   curl -O https://raw.githubusercontent.com/opena2a-org/agent-identity-management/main/docker-compose.quickstart.yml
#   curl -O https://raw.githubusercontent.com/opena2a-org/agent-identity-management/main/.env.quickstart
#   mv .env.quickstart .env
#   # Generate secure passwords (or edit .env manually):
#   sed -i.bak "s|CHANGE_ME_POSTGRES|$(openssl rand -hex 16)|; s|CHANGE_ME_REDIS|$(openssl rand -hex 16)|; s|CHANGE_ME_JWT|$(openssl rand -hex 32)|; s|CHANGE_ME_KEYVAULT|$(openssl rand -base64 32)|" .env && rm .env.bak
#   docker compose -f docker-compose.quickstart.yml up -d
#   open http://localhost:3000
#
# Host ports and container names come from the environment (or .env), with these defaults:
#   AIM_POSTGRES_PORT=5432  AIM_REDIS_PORT=6379  AIM_BACKEND_PORT=8080  AIM_FRONTEND_PORT=3000
#   AIM_PROJECT=aim   (prefix of the container names: aim-postgres, aim-redis,
#                      aim-backend, aim-frontend)
# Compose names the volumes and the network after its project, which is
# COMPOSE_PROJECT_NAME when set and otherwise this file's directory. Two stacks
# run side by side on one host when each has its own project, AIM_PROJECT and ports.

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ${AIM_PROJECT:-aim}-postgres
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    # SECURITY: Bound to localhost only. Do not remove 127.0.0.1 prefix.
    ports:
      - "127.0.0.1:${AIM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  redis:
    image: redis:7-alpine
    container_name: ${AIM_PROJECT:-aim}-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    # SECURITY: Bound to localhost only. Do not remove 127.0.0.1 prefix.
    ports:
      - "127.0.0.1:${AIM_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  backend:
    image: ghcr.io/opena2a-org/aim-server:latest
    container_name: ${AIM_PROJECT:-aim}-backend
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=identity
      - POSTGRES_SSL_MODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - KEYVAULT_MASTER_KEY=${KEYVAULT_MASTER_KEY:?Set KEYVAULT_MASTER_KEY in .env}
      # For non-localhost deployments, update FRONTEND_URL and ALLOWED_ORIGINS
      # to match the actual URL where the dashboard is accessed. By default
      # they follow the dashboard's host port.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:${AIM_FRONTEND_PORT:-3000}}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:${AIM_FRONTEND_PORT:-3000}}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@opena2a.org}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    ports:
      - "${AIM_BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aim-network

  frontend:
    image: ghcr.io/opena2a-org/aim-dashboard:latest
    container_name: ${AIM_PROJECT:-aim}-frontend
    environment:
      # The URL the browser reaches the API at. It follows the backend's host port unless
      # FRONTEND_API_URL is set, which a dashboard opened from another machine or behind a
      # reverse proxy needs. docs/DEPLOYMENT.md (Docker) says which aim-dashboard images
      # read it each time they render a page.
      - NEXT_PUBLIC_API_URL=${FRONTEND_API_URL:-http://localhost:${AIM_BACKEND_PORT:-8080}}
      - NODE_ENV=production
    ports:
      - "${AIM_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aim-network

volumes:
  postgres_data:
  redis_data:

networks:
  aim-network:
    driver: bridge
