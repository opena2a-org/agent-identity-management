# Ruff configuration for the Python SDK. CI runs `ruff check` from this
# directory (the sdk-python-tests job in .github/workflows/ci.yml), and
# tests/test_lint_ruff.py runs it as part of the test suite.
#
# The rules are named here, so the installed ruff's default rule set does not
# decide what is checked: pyflakes (F) and the pycodestyle error rules E4, E7
# and E9.
target-version = "py38"  # setup.py: python_requires=">=3.8,<3.15"

[lint]
select = ["E4", "E7", "E9", "F"]

# Baseline: the findings each of these files had when this configuration was
# added, waived per file and per rule. A file not listed here, and a rule not
# listed for a file, is checked in full. Fixing a file means removing its line
# (or the rule from it); do not add lines for new code.
[lint.per-file-ignores]
"aim_sdk/__init__.py" = ["E402", "F401"]
"aim_sdk/a2a.py" = ["E722", "F401"]
"aim_sdk/attestation_cache.py" = ["F401"]
"aim_sdk/console.py" = ["F401", "F541"]
