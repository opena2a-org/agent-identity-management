[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    -m "not integration"

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring a live AIM backend (deselect with '-m "not integration"')
