global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: aim-demo
    replica: "0"

# Inbound metrics arrive via the OTLP write receiver
# (--enable-feature=otlp-write-receiver in compose).
# Scrape jobs below cover the collector's self-metrics so the demo
# stack itself is observable.

scrape_configs:
  - job_name: otel-collector
    scrape_interval: 10s
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          source: collector_self_metrics
