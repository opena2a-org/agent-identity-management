name: Sync to AIM Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source (agent-identity-management)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout target (aim-frontend)
        uses: actions/checkout@v4
        with:
          repository: opena2a-org/aim-frontend
          token: ${{ secrets.AIM_CLOUD_SYNC_TOKEN }}
          path: target

      - name: Run sync script
        run: |
          chmod +x source/scripts/sync-to-frontend.sh
          source/scripts/sync-to-frontend.sh source target

      - name: Check for changes
        id: changes
        working-directory: target
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to sync"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --cached --stat
          fi

      - name: Create PR if changes exist
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.AIM_CLOUD_SYNC_TOKEN }}
        run: |
          git config user.name "OpenA2A Sync Bot"
          git config user.email "sync@opena2a.org"

          SOURCE_SHA=$(git -C ../source rev-parse --short HEAD)
          SOURCE_MSG=$(git -C ../source log -1 --pretty=%s)
          BRANCH="sync/frontend-${SOURCE_SHA}-$(date +%Y%m%d)"

          git checkout -b "$BRANCH"
          git commit -m "$(cat <<EOF
          Sync from agent-identity-management ${SOURCE_SHA}

          Source commit: ${SOURCE_MSG}
          Automated by sync-to-frontend workflow.
          EOF
          )"

          git push origin "$BRANCH"

          gh pr create \
            --repo opena2a-org/aim-frontend \
            --title "Sync from agent-identity-management (${SOURCE_SHA})" \
            --body "$(cat <<'BODY'
          ## Automated Sync

          This PR syncs frontend changes from the public `agent-identity-management` repo
          to `aim-frontend` (Vercel deployment).

          ### What to review

          - Verify no protected files were overwritten (check `.sync-protect`)
          - Run `npm run build` to verify the build passes
          - Check Vercel preview deployment for visual regressions

          ### Protected files

          Files listed in `.sync-protect` are never overwritten. Cloud-only files
          (auth pages, settings, middleware, api.ts) are always preserved.
          BODY
          )" \
            --label "sync"
