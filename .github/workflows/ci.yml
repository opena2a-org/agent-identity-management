name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter lists PR files via the REST API on pull_request
  # events (the checkout only serves push-event detection). That API call
  # succeeds without this permission only because the repo is public; if
  # visibility ever changes it 403s, the changes job fails, and the gate
  # fails closed — wedging every PR. Keep the permission explicit.
  pull-requests: read

jobs:
  # Reject ${VAR:-fallback} patterns for secret-shaped env vars in any
  # docker-compose*.yml. Catches the CWE-798 regression that shipped to main
  # multiple times before — see scripts/lint-no-secret-fallbacks.sh for the
  # closed set of names enforced. Unconditional (no path filter) because the
  # script is sub-second and the failure mode is silent if it ever stops running.
  secrets-lint:
    name: Compose secret-fallback lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No ${VAR:-fallback} for secret-shaped env vars
        run: ./scripts/lint-no-secret-fallbacks.sh

  # Validate the workflow files themselves. Nothing did, and it cost five days of a
  # dead sync: a comment in sync-to-cloud.yml contained a literal expression-interpolation
  # token to illustrate a point, Actions substitutes those inside a run: block before any
  # shell exists so `#` did not protect it, and an empty pair is an invalid expression.
  # GitHub rejected the whole file with "this run likely failed because of a workflow file
  # issue" on every push from 8d79696 to 8ea0ceb -- which meant the alert step that exists
  # to file the sync backlog never executed.
  #
  # The file parsed as valid YAML the whole time, and every other check on the PR was
  # green, so nothing in this repo could see it. An invalid workflow file also bypasses
  # `on.push.paths`, so it fails on pushes that do not even touch the filtered paths.
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workflow files must be valid to GitHub, not merely valid YAML
        run: |
          set -euo pipefail
          ver=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          # shellcheck is absent on the runner image path actionlint probes; -shellcheck=
          # disables that integration so this job fails on workflow-level defects only and
          # does not become a shell-style gate by accident.
          ./actionlint -shellcheck= -color

  # AST lint that catches HTTP handlers reading c.Params("id"|"agent_id")
  # without invoking the tenant-scoping helper (LoadOwned or
  # LoadOwnedViaAgent). The structural guarantee for the defect #18-25
  # cluster — a future handler that forgets tenant scoping fails CI before
  # merge. Pre-existing handlers without the helper are allowlisted (see
  # cmd/tenantscope-lint/main.go) and tracked for systematic follow-up.
  tenant-scoping-lint:
    name: Tenant-scoping lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum
      - name: No handler reads :id without LoadOwned
        run: ./scripts/lint-tenant-scoping.sh

  # sync-to-cloud.sh mirrors five directories with `rsync --delete`. Those
  # mirrors did not consult .sync-protect, so an entry under them was silently
  # ineffective and cloud-only files there were deleted outright. Runs
  # unconditionally rather than behind the `changes` filter: the thing being
  # guarded is the script's behaviour on aim-cloud's tree, and a regression
  # there is invisible from this repo's own test results.
  sync-protect-guard:
    name: Sync protect guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .sync-protect is honoured by every sync path
        run: ./scripts/test-sync-protect.sh

  # The `docker` paths filter in security.yml decides whether Container Scan
  # runs. It was maintained beside the Dockerfiles rather than derived from
  # them and drifted twice (#389, #398), each time letting a change to the
  # image's own contents skip the scan of that image. Unconditional, because
  # the drift it catches is a change to a Dockerfile OR to the filter, and
  # gating this check behind a filter would reintroduce the class it exists
  # to close.
  docker-paths-filter:
    name: Docker paths filter follows the Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every COPY source is covered by the docker filter
        run: ./scripts/lint-docker-paths-filter.sh

  # The automated review's input. pr-review.yml hands the model a diff and a
  # full-file list composed by scripts/pr-review-generated-files.mjs: generated
  # lockfiles excluded at any depth, npm lockfile hunks replaced by a
  # placeholder carrying a deterministic predicate's verdict, and that verdict
  # enforced from the instrument's own report. Those properties, and the
  # workflow wiring that carries them, are asserted by node:test cells under
  # scripts/ over fixture trees the cells write to a temporary directory.
  # Unconditional and needed by the gate, with no escape hatch of any kind:
  # the cells assert over THIS file that the gate keeps needing this job, a
  # guard that only works if the job runs on every PR. The cells live under
  # scripts/ rather than sdk/typescript/tests/ because `sdk/**` is inside
  # docker-publish.yml's release filter, and this guard must never be the
  # reason an image ships.
  pr-review-input-guard:
    name: PR review input guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: The review input composer and its predicate hold their contract
        run: node --test scripts/test-pr-review-generated-files.mjs

  # A BLOCKING audit of the SDK's shipped dependency tree.
  #
  # Why this exists, and why it is separate from security.yml's "Dependency Audit":
  # that job cannot fail. Both of its Trivy steps pass `exit-code: 0`, its npm audit
  # ends in `|| true`, and it only looks at apps/web. It reported SUCCESS on every PR
  # while sdk/typescript shipped js-yaml 4.3.0 (GHSA-5p4m-2wfm-xmqj, HIGH) — a green
  # check that was structurally incapable of going red, over a directory it never read.
  #
  # The defect was eventually caught downstream, by aim-cloud's Trivy on a sync PR,
  # which is the wrong place: by then the vulnerable floor was already being carried
  # into the hosted product. This gate moves that catch to the source.
  #
  # Scope is deliberate and measured, not arbitrary:
  #   --omit=dev      only dependencies that reach consumers of @opena2a/aim-sdk.
  #                   Dev-only findings do not ship and must not be able to wedge an
  #                   unrelated PR; they are tracked separately.
  #   --package-lock-only
  #                   installs nothing, so no dependency's install script executes on
  #                   a fork's pull request.
  #   sdk/typescript  measured clean (0 high, 0 critical) at 0b1f876. The repo ROOT
  #                   tree is NOT gated here because it currently carries 4 prod highs
  #                   (next, sharp, postcss, nanoid); adding it today would land a
  #                   permanently-red gate, which teaches people to ignore it. Widen
  #                   this to `.` once those are resolved — that is the intended end
  #                   state, not a permanent exemption.
  sdk-dependency-audit:
    name: SDK dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: No high or critical advisories in the SDK's shipped dependencies
        working-directory: sdk/typescript
        run: |
          set -uo pipefail
          # No `|| true`, and no `exit-code: 0`. A finding here fails the gate.
          npm audit --package-lock-only --omit=dev --audit-level=high

  # Blocking dependency scan over the manifests readers install from outside the
  # hosted build: every example under examples/ and the Java SDK. Before this job,
  # no workflow read either tree. The Java demo shipped bcprov 1.79 (two critical
  # advisories) and jackson-databind 2.16.1 while every check stayed green, and the
  # four example requirements.txt files held version floors that a scanner reads
  # as zero packages.
  #
  # The job can only go green by proving it read its input:
  #   - Trivy is fetched from the upstream release and checked against the
  #     sha256 below before extraction. No trivy-action or setup-trivy: they
  #     fetch by version, so no digest would sit in this reviewed file, and they
  #     were the delivery vector of GHSA-69fq-xp46-6x23.
  #     Pin: v0.74.0 (released 2026-08-14, immutable release), sigstore
  #     signature verified at pin time against aquasecurity/trivy's
  #     reusable-release.yaml@refs/tags/v0.74.0.
  #   - Positive controls, one per manifest class (pom.xml, requirements.txt),
  #     run first with the same binary, flags, config and exception file. A
  #     control passes only on the findings exit code (3) AND its expected
  #     advisory ID in the JSON. A scanner crash (FATAL) exits 1, so it cannot
  #     pass as a detected control, and it fails with its own message.
  #   - Coverage: every tracked manifest under the scanned trees must appear in
  #     Trivy's output as a target with at least one package (for a declaration
  #     with a lock beside it, the lock). A manifest the scanner cannot read
  #     fails the job; it is never reported as clean.
  #   - Config isolation: Trivy reads a config file this job writes and the
  #     exception file below, both passed explicitly, so a .trivyignore or
  #     trivy.yaml added by a pull request cannot suppress a finding.
  #   - Exceptions: only lines in .github/trivy-exceptions.txt, each
  #     `<ID> exp:<YYYY-MM-DD>` at most 30 days out, directly under a
  #     `# reason: ... owner: ...` comment. Changing that file needs gate-file
  #     approval.
  #   - Offline scan (--offline-scan) with an empty HOME: Maven Central
  #     rate-limits Trivy's POM resolution (429 measured), so the scan reads
  #     declared dependencies, deterministically. Transitive Maven closures
  #     are a known gap, tracked separately.
  #
  # Unconditional (no `if:`, no path filter), no continue-on-error, no `|| true`;
  # tests/ci-gate-workflow-shape.test.ts in sdk/typescript asserts that.
  example-java-manifest-audit:
    name: Example and Java SDK manifest audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
      SCAN_DIRS: examples sdk/java
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Exception file holds only expiring, attributed entries
        run: |
          set -euo pipefail
          f=.github/trivy-exceptions.txt
          test -f "$f" || { echo "::error file=$f::exception file is missing"; exit 1; }
          max=$(date -u -d '+30 days' +%F)
          today=$(date -u +%F)
          prev='' ; n=0 ; bad=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            case "$line" in
              ''|'#'*) prev=$line; continue ;;
            esac
            if ! [[ "$line" =~ ^[A-Za-z0-9._:-]+\ exp:([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
              echo "::error file=$f,line=$n::exception line must be '<ID> exp:<YYYY-MM-DD>': $line"; bad=1
            else
              exp=${BASH_REMATCH[1]}
              if [[ "$exp" > "$max" || "$exp" < "$today" ]]; then
                echo "::error file=$f,line=$n::exp:$exp must be between $today and $max"; bad=1
              fi
              if ! [[ "$prev" == '# reason:'*'owner:'* ]]; then
                echo "::error file=$f,line=$n::the line above must be '# reason: ... owner: ...'"; bad=1
              fi
            fi
            prev=$line
          done < "$f"
          exit "$bad"

      - name: Install Trivy (sha256-verified release binary)
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/trivy.tgz"
          curl -fsSL --retry 3 -o "$tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${tgz}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin" "$RUNNER_TEMP/trivy-home"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/trivy-bin" trivy
          # The only config Trivy reads: written here, never from the checkout.
          printf '# written by the example-java-manifest-audit job\n' > "$RUNNER_TEMP/trivy-config.yaml"
          "$RUNNER_TEMP/trivy-bin/trivy" --version

      - name: Positive controls, then scan and coverage
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/trivy-bin/trivy"
          out="$RUNNER_TEMP/trivy-out"
          mkdir -p "$out"
          trivy_fs() { # <dir> <json-out> [extra flags...]
            local dir=$1 json=$2; shift 2
            HOME="$RUNNER_TEMP/trivy-home" "$T" fs --scanners vuln --severity CRITICAL,HIGH \
              --offline-scan --list-all-pkgs --format json --exit-code 3 \
              --cache-dir "$RUNNER_TEMP/trivy-cache" \
              --config "$RUNNER_TEMP/trivy-config.yaml" \
              --ignorefile "$GITHUB_WORKSPACE/.github/trivy-exceptions.txt" \
              --output "$json" "$@" "$dir"
          }

          # One DB download per run; every scan below reads the same DB.
          HOME="$RUNNER_TEMP/trivy-home" "$T" fs --download-db-only --no-progress \
            --cache-dir "$RUNNER_TEMP/trivy-cache" --config "$RUNNER_TEMP/trivy-config.yaml"
          HOME="$RUNNER_TEMP/trivy-home" "$T" version --cache-dir "$RUNNER_TEMP/trivy-cache" --format json \
            | jq -r '"Vulnerability DB: version \(.VulnerabilityDB.Version), UpdatedAt \(.VulnerabilityDB.UpdatedAt)"'

          # Positive controls. Written to the temp dir, never committed, so no
          # vulnerable manifest appears in the repository's dependency graph.
          ctl="$RUNNER_TEMP/controls"
          mkdir -p "$ctl/pom" "$ctl/pip"
          cat > "$ctl/pom/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>control</groupId>
            <artifactId>control</artifactId>
            <version>1</version>
            <dependencies>
              <dependency>
                <groupId>com.fasterxml.jackson.core</groupId>
                <artifactId>jackson-databind</artifactId>
                <version>2.9.8</version>
              </dependency>
            </dependencies>
          </project>
          POM
          printf 'PyYAML==5.3\n' > "$ctl/pip/requirements.txt"
          fail=0
          for c in "pom:pom.xml:CVE-2019-14379" "pip:requirements.txt:CVE-2020-14343"; do
            IFS=: read -r cls target id <<< "$c"
            rc=0; trivy_fs "$ctl/$cls" "$out/control-$cls.json" --skip-db-update || rc=$?
            if [ "$rc" -ne 3 ]; then
              echo "::error::control $cls: Trivy exited $rc, expected 3 (findings). A scanner error or a clean read means the scan cannot be trusted."
              fail=1; continue
            fi
            if ! jq -e --arg t "$target" --arg id "$id" \
                '[.Results[]? | select(.Target == $t) | .Vulnerabilities[]?.VulnerabilityID] | index($id)' \
                "$out/control-$cls.json" > /dev/null; then
              echo "::error::control $cls: $id not reported on $target"
              fail=1; continue
            fi
            echo "control $cls: detected $id on $target"
          done
          [ "$fail" -eq 0 ] || exit 1

          # The real scan.
          found=0
          for d in $SCAN_DIRS; do
            rc=0; trivy_fs "$d" "$out/scan-${d//\//_}.json" --skip-db-update || rc=$?
            case "$rc" in
              0) ;;
              3) found=1 ;;
              *) echo "::error::Trivy failed on $d (exit $rc); this is a scanner error, not a finding"; exit 1 ;;
            esac
          done

          # Coverage: every tracked manifest must have been read.
          manifest_re='(^|/)(pom\.xml|requirements[^/]*\.txt|package\.json|package-lock\.json|go\.mod|pyproject\.toml|setup\.py|Pipfile|Pipfile\.lock|poetry\.lock|uv\.lock|build\.gradle|build\.gradle\.kts|gradle\.lockfile)$'
          for d in $SCAN_DIRS; do
            json="$out/scan-${d//\//_}.json"
            list="$out/manifests-${d//\//_}.txt"
            # Built in its own commands so a git failure stops the job instead of
            # yielding an empty list that would pass the loop below vacuously.
            git ls-files -- "$d" > "$out/tracked.txt"
            # ENVIRON, not -v: awk -v processes backslash escapes, turning \. into "any character".
            MANIFEST_RE="$manifest_re" awk '$0 ~ ENVIRON["MANIFEST_RE"]' "$out/tracked.txt" | sort -u > "$list"
            if [ ! -s "$list" ]; then
              echo "::error::no tracked manifest found under $d; the inventory is broken, so coverage cannot be shown"
              exit 1
            fi
            while IFS= read -r m; do
              dir=$(dirname "$m"); base=$(basename "$m"); need=$m
              lock=''
              case "$base" in
                package.json) lock=package-lock.json ;;
                pyproject.toml) if [ -f "$dir/uv.lock" ]; then lock=uv.lock; else lock=poetry.lock; fi ;;
                Pipfile) lock=Pipfile.lock ;;
                build.gradle|build.gradle.kts) lock=gradle.lockfile ;;
              esac
              if [ -n "$lock" ] && [ -f "$dir/$lock" ]; then need="$dir/$lock"; fi
              rel=${need#"$d"/}
              pkgs=$(jq --arg t "$rel" '[.Results[]? | select(.Target == $t) | .Packages[]?] | length' "$json")
              echo "manifest $m -> $need: $pkgs packages"
              if [ "$pkgs" -lt 1 ]; then
                echo "::error file=$m::the scanner read no packages from $need. Pin exact versions (for Python: requirements.in plus a uv pip compile lock) so it can be scanned."
                fail=1
              fi
            done < "$list"
          done

          # Findings, one line each, with a local reproduce command.
          for d in $SCAN_DIRS; do
            jq -r --arg d "$d" '.Results[]? | .Target as $t | .Vulnerabilities[]? |
              "::error file=\($d)/\($t)::\(.PkgName) \(.InstalledVersion) \(.VulnerabilityID) \(.Severity), fixed in \(.FixedVersion // "no fixed release"). Reproduce: trivy fs --scanners vuln --severity CRITICAL,HIGH --offline-scan \($d)"' \
              "$out/scan-${d//\//_}.json"
          done
          [ "$found" -eq 0 ] || fail=1
          [ "$fail" -eq 0 ] || exit 1
          echo "No high or critical advisories; every manifest was read; both controls detected."

  # The TypeScript SDK's vitest suite (78 test files at the time this job
  # landed) and its typecheck ran in NO pull-request workflow — release.yml
  # runs them at publish time only, so an SDK regression was caught after
  # merge at the earliest, on a tag. This job moves that catch to the PR,
  # with the same zero-skip refusal shape release.yml uses: a green run
  # must mean the suite actually ran, all of it, and passed.
  #
  # Deliberately unconditional (no `if:`, no path filter): the suite
  # includes tests/ci-gate-workflow-shape.test.ts, which asserts over THIS
  # file that the gate keeps needing this job and that no escape hatch
  # (continue-on-error, `|| true`, a skipping `if:`) is ever added — a
  # guard that only works if the job runs on every PR. No step here may
  # gain continue-on-error or `|| true`; that test fails the gate if one does.
  sdk-tests:
    name: SDK tests (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      # CI=true so the environment-gated cases execute wherever they can;
      # the refusal is the committed per-assertion checker shared with
      # release.yml's publish-time step. It walks every
      # testResults[].assertionResults[].status in the JSON report — the
      # aggregate numPendingTests/numTodoTests counters count a
      # skipIf-skipped case as passed and must never gate again. The
      # --allow-skips entries are the gate's only tolerated skips: the
      # environment-gated integration files this runner cannot execute (no
      # AIM backend, no credentials), each bound to that file's it.skipIf
      # case count. Any skip outside them, or more skips in one of them
      # than its bound, fails the gate; growing a bound is a gate change.
      # See docs/testing/sdk-publish-gate.md.
      - name: Test (a skipped test fails the gate)
        env:
          CI: "true"
        run: |
          npx vitest run --reporter=default --reporter=json --outputFile=/tmp/vitest-report.json
          node scripts/check-vitest-report.mjs /tmp/vitest-report.json \
            --allow-skips=src/a2a/A2AClient.integration.test.ts:21 \
            --allow-skips=src/client/AIMClient.integration.test.ts:13 \
            --allow-skips=src/auth/oauth.integration.test.ts:2

      - name: Typecheck
        run: npm run typecheck

  # The Python SDK had no test job anywhere in CI and the publish job built
  # the artifact without running a test (measured 2026-09-08), so a regression
  # test could not prove anything before merge. Not conditioned on CI or on
  # changed paths: a missing precondition is an error, never a skip.
  sdk-python-tests:
    name: SDK tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # release.yml's publish job pins 3.12; the gate runs where the artifact is built.
          python-version: "3.12"

      - name: Install the SDK with its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      # The suite must run (total > 0) with zero failures and zero errors.
      # Skips are reported, not yet refused: the suite carried 34 skip markers
      # when this job was added; driving them to zero is its own change, after
      # which the refusal gains `skipped > 0`.
      - name: Test (the suite must run, with zero failures and zero errors)
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=/tmp/pytest-report.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("/tmp/pytest-report.xml").getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          total = sum(int(s.get("tests", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"tests total={total} failed={failed} errors={errors} skipped={skipped}")
          if not total > 0 or failed > 0 or errors > 0:
              print("refusing to pass: the suite must run with zero failures and zero errors", file=sys.stderr)
              sys.exit(1)
          PY

  # Detect which parts of the monorepo changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # ci.yml is in both filters: a PR that edits this workflow must
            # run the full suite under the edited workflow, not skip it.
            # Root package.json/package-lock.json feed apps/web via npm
            # workspaces (apps/web has no lockfile of its own) — a root dep
            # bump that skipped the frontend build would merge unvalidated.
            # `sdk/**` is here because the backend IMAGE contains it:
            # infrastructure/docker/Dockerfile.backend does `COPY sdk ./sdk` in
            # its final stage. The filter listed only apps/backend/**, so every
            # sdk-only change skipped the backend job AND the container scan for
            # an image whose contents that change had just altered. The filter
            # has to match the Dockerfile's inputs, and the Dockerfile's inputs
            # are exactly apps/backend/** and sdk/**.
            backend:
              - 'apps/backend/**'
              - 'sdk/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            # ATX credential paths gated by the pinned atx-conformance suite:
            # the Java LocalAtxVerifier (+ its vendored fixtures) and the Go
            # issuance client whose Raw pass-through must stay byte-preserving.
            conformance:
              - 'sdk/java/**'
              - 'apps/backend/internal/infrastructure/registry/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: jsonarray-lint (null-array regression guard)
        run: |
          LINT_TMP=$(mktemp -d -t jsonarray-lint.XXXXXX)
          trap 'rm -rf "$LINT_TMP"' EXIT
          go build -o "$LINT_TMP/jsonarray-lint" ./cmd/jsonarray-lint/
          "$LINT_TMP/jsonarray-lint" \
            internal/interfaces/http/handlers \
            internal/infrastructure/repository \
            internal/application

      # A `timestamp without time zone` column silently shifts the stored instant by the
      # writing process's UTC offset — and, for DEFAULT NOW(), by the PostgreSQL session's.
      # The baseline holds the declarations that predate migration 106 and must never grow.
      - name: timestamptz-lint (naked TIMESTAMP guard)
        run: |
          LINT_TMP=$(mktemp -d -t timestamptz-lint.XXXXXX)
          trap 'rm -rf "$LINT_TMP"' EXIT
          go build -o "$LINT_TMP/timestamptz-lint" ./cmd/timestamptz-lint/
          "$LINT_TMP/timestamptz-lint" \
            --baseline cmd/timestamptz-lint/historical-baseline.txt \
            migrations

      - name: Test with coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Check coverage thresholds
        run: |
          check_coverage() {
            local pkg_pattern="$1"
            local min_pct="$2"
            local label="$3"

            # Extract coverage for matching packages
            local pct
            pct=$(grep "$pkg_pattern" coverage.txt \
              | awk '{print $NF}' \
              | sed 's/%//' \
              | awk '{ sum += $1; n++ } END { if (n > 0) printf "%.1f", sum/n; else print "0" }')

            if [ -z "$pct" ] || [ "$pct" = "0" ]; then
              echo "⚠ $label: no coverage data found (pattern: $pkg_pattern)"
              return 0
            fi

            local pass
            pass=$(echo "$pct >= $min_pct" | bc -l)
            if [ "$pass" -eq 1 ]; then
              echo "✓ $label: ${pct}% (minimum: ${min_pct}%)"
            else
              echo "✗ $label: ${pct}% is below minimum ${min_pct}%"
              return 1
            fi
          }

          FAILED=0
          check_coverage "internal/domain" 90 "Domain layer" || FAILED=1
          check_coverage "internal/crypto/pqc" 85 "PQC crypto" || FAILED=1
          check_coverage "internal/crypto" 75 "Crypto layer" || FAILED=1
          check_coverage "internal/infrastructure/auth" 60 "Auth layer" || FAILED=1

          # Overall coverage (30% minimum — cmd/ and infra/ have 0% which drags average)
          TOTAL=$(grep "^total:" coverage.txt | awk '{print $NF}' | sed 's/%//')
          if [ -n "$TOTAL" ]; then
            PASS=$(echo "$TOTAL >= 30" | bc -l)
            if [ "$PASS" -eq 1 ]; then
              echo "✓ Overall: ${TOTAL}% (minimum: 30%)"
            else
              echo "✗ Overall: ${TOTAL}% is below minimum 30%"
              FAILED=1
            fi
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage.out

  # Conformance gate: AIM's ATX credential paths must accept/reject exactly
  # what the pinned opena2a-standards/atx-conformance fixtures say (the suite
  # the Go/Python reference verifiers and @opena2a/atx-verify are gated on).
  # Two paths are gated here:
  #   1. sdk/java LocalAtxVerifier — runs the conformance fixture set (vendored
  #      copies, byte-checked against the pinned suite below so they cannot
  #      silently drift).
  #   2. apps/backend Go issuance client — replays every pinned credential as
  #      a Registry response and asserts the signed bytes survive AIM's
  #      issuance path unmodified (Raw pass-through byte-match).
  atx-conformance:
    name: ATX conformance
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    env:
      # Pinned suite ref. Bump deliberately when the suite grows; the vendored
      # Java fixture copies must be refreshed in the same PR or the drift gate
      # below fails.
      ATX_CONFORMANCE_REF: d2b8376daaec47046e54a3035178d706a5edec1d
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned atx-conformance suite
        run: |
          git clone --no-checkout https://github.com/opena2a-standards/atx-conformance.git /tmp/atx-conformance
          git -C /tmp/atx-conformance checkout "$ATX_CONFORMANCE_REF"

      - name: MANIFEST.sha256 integrity
        working-directory: /tmp/atx-conformance
        run: |
          rc=0
          while read -r sha file; do
            [ -z "$sha" ] && continue
            got=$(sha256sum "$file" | awk '{print $1}')
            if [ "$got" != "$sha" ]; then
              echo "::error::MANIFEST mismatch: $file"; rc=1
            fi
          done < MANIFEST.sha256
          exit $rc

      - name: Vendored Java fixtures byte-match the pinned suite
        run: |
          fail=0
          for f in /tmp/atx-conformance/fixtures/*.json; do
            b=$(basename "$f")
            if ! cmp -s "$f" "sdk/java/src/test/resources/atx-fixtures/$b"; then
              echo "::error::vendored fixture $b is missing or drifted from the pinned suite"
              fail=1
            fi
          done
          for f in sdk/java/src/test/resources/atx-fixtures/*.json; do
            b=$(basename "$f")
            if [ ! -f "/tmp/atx-conformance/fixtures/$b" ]; then
              echo "::error::vendored fixture $b does not exist in the pinned suite"
              fail=1
            fi
          done
          exit $fail

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      # Scoped to the atx package: the SDK's Live/RealWorld integration tests
      # need a live backend and credentials that CI does not have.
      - name: Java LocalAtxVerifier vs pinned fixtures
        working-directory: sdk/java
        run: mvn -B test -Dtest='org.opena2a.aim.atx.*Test'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      # The test t.Skips when ATX_CONFORMANCE_DIR is unset (so local
      # `go test ./...` needs no suite checkout) — the grep guards against
      # this step ever passing on a silent skip if the env line is dropped.
      - name: Go issuance byte-match vs pinned fixtures
        working-directory: apps/backend
        env:
          ATX_CONFORMANCE_DIR: /tmp/atx-conformance/fixtures
        run: |
          go test ./internal/infrastructure/registry/ -run TestATCIssuance_ConformanceByteMatch -v | tee /tmp/atc-conformance.out
          grep -q -- "--- PASS: TestATCIssuance_ConformanceByteMatch/baseline-valid.json" /tmp/atc-conformance.out

  frontend:
    name: Frontend (Next.js)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      # Unit tests were never run in CI. `npm run test` (vitest) existed, and the one
      # spec in the tree ran nowhere that could block a merge -- so a regression test
      # added here would have gated nothing.
      - name: Unit tests (vitest)
        working-directory: apps/web
        run: npm run test -- --run

      - name: Build
        working-directory: apps/web
        run: npm run build

  # Fan-in gate so branch protection can require ONE check that always
  # reports. The path-filtered jobs (backend/frontend/e2e) legitimately skip
  # when nothing relevant changed — a skip counts as a pass here — but a
  # required check pointed directly at them would sit forever on
  # "Expected — waiting for status" for PRs that don't touch code.
  # Change-detection itself MUST succeed; otherwise the expensive jobs were
  # skipped for the wrong reason and a code change could slip through
  # untested — fail closed. New jobs added to this workflow must be added to
  # `needs` below or the gate silently stops covering them. This job must
  # keep `if: always()` and the workflow must never gain a top-level
  # `paths:` filter — GitHub counts a skipped or never-reported required
  # check as satisfied or wedges the PR, respectively.
  # Go integration tests. The `backend` job runs `go test ./...`, which compiles
  # OUT everything behind `//go:build integration` and sets no TEST_DATABASE_URL,
  # so the trigger, constraint and migration tests have never run in CI. They
  # rotted undetected because of it: by 2026-08-05 all eleven failed against a
  # correctly-migrated database, on NOT NULL columns the schema had grown
  # underneath them (repaired in #351). `e2e-empty-state` applies migrations, so
  # a migration that cannot apply is caught — but nothing asserts what the
  # triggers and CHECK constraints actually do.
  integration:
    name: Integration Tests (Postgres)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aim
          POSTGRES_PASSWORD: aim
          POSTGRES_DB: aim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aim -d aim_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://aim:aim@localhost:5432/aim_test?sslmode=disable
      TEST_DATABASE_URL: postgres://aim:aim@localhost:5432/aim_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      # Same runner cmd/server uses at startup, so a migration that cannot
      # apply fails here rather than on a production container boot.
      - name: Apply migrations
        run: go run ./cmd/migrate

      - name: Run integration tests
        run: go test -tags=integration -race ./...

      # These tests call t.Skip when TEST_DATABASE_URL is unset, so a broken env
      # would leave the job green having asserted nothing — the same silent
      # no-op that let the fixtures rot. Fail loudly instead.
      #
      # The selector and the package list must both cover any new integration
      # test, or the step above still runs it while this assertion silently
      # stops applying to it. AgentRevocation + the middleware package were
      # added for exactly that reason; UpdateDoesNotWriteTrustScore + RoundTrip
      # and the repository package were added for the same reason after the MCP
      # trust-score write-path fix; RevocationList + the handlers package were
      # added after the revocation list was found returning an empty list for
      # every caller, which no test had ever asserted against; NakedTimestamp
      # was added with migration 106; A2AListAllTenantScope was added with the
      # A2A consent and trust-score org scoping, whose whole assertion is that
      # one tenant cannot see another's rows -- a silent skip there restores the
      # defect green; ConsentGrantorOwnership was added with the RecordConsent
      # grantor check, where one of the four asserts two rejection responses are
      # indistinguishable, so a skip hides an enumeration oracle rather than a
      # missing feature.
      - name: Assert integration tests were not skipped
        run: |
          set -o pipefail
          go test -tags=integration -v \
            -run 'Trigger|Backfill|OutOfScale|AgentRevocation|UpdateDoesNotWriteTrustScore|RoundTrip|SeededMCPPoliciesAreNotEnabled|RevocationList|AgentRepositoryList|NullDescription|NakedTimestamp|CrossTenant|ConsentGrantorOwnership|A2AListAllTenantScope' \
            ./internal/application/... ./internal/interfaces/http/middleware/... \
            ./internal/infrastructure/repository/... \
            ./internal/interfaces/http/handlers/... 2>&1 | tee /tmp/integration.log
          if grep -q '^--- SKIP' /tmp/integration.log; then
            echo "::error::Integration tests were SKIPPED — TEST_DATABASE_URL is not reaching them."
            grep '^--- SKIP' /tmp/integration.log
            exit 1
          fi
          if ! grep -q '^--- PASS' /tmp/integration.log; then
            echo "::error::No integration test reported PASS — the selector matched nothing."
            exit 1
          fi

  ci-gate:
    name: CI Gate
    needs:
      [
        secrets-lint,
        tenant-scoping-lint,
        workflow-lint,
        sync-protect-guard,
        docker-paths-filter,
        sdk-dependency-audit,
        example-java-manifest-audit,
        sdk-tests,
        sdk-python-tests,
        pr-review-input-guard,
        changes,
        backend,
        integration,
        atx-conformance,
        frontend,
        e2e-empty-state,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          sl='${{ needs.secrets-lint.result }}'
          tl='${{ needs.tenant-scoping-lint.result }}'
          wl='${{ needs.workflow-lint.result }}'
          sp='${{ needs.sync-protect-guard.result }}'
          dp='${{ needs.docker-paths-filter.result }}'
          sa='${{ needs.sdk-dependency-audit.result }}'
          ea='${{ needs.example-java-manifest-audit.result }}'
          st='${{ needs.sdk-tests.result }}'
          spt='${{ needs.sdk-python-tests.result }}'
          pg='${{ needs.pr-review-input-guard.result }}'
          ch='${{ needs.changes.result }}'
          be='${{ needs.backend.result }}'
          it='${{ needs.integration.result }}'
          ax='${{ needs.atx-conformance.result }}'
          fe='${{ needs.frontend.result }}'
          ee='${{ needs.e2e-empty-state.result }}'
          echo "secrets-lint=$sl tenant-scoping-lint=$tl workflow-lint=$wl sync-protect-guard=$sp docker-paths-filter=$dp sdk-dependency-audit=$sa example-java-manifest-audit=$ea sdk-tests=$st sdk-python-tests=$spt pr-review-input-guard=$pg changes=$ch"
          echo "backend=$be integration=$it atx-conformance=$ax frontend=$fe e2e-empty-state=$ee"
          fail=0
          # Unconditional jobs must succeed outright.
          for pair in "secrets-lint:$sl" "tenant-scoping-lint:$tl" "workflow-lint:$wl" "sync-protect-guard:$sp" "docker-paths-filter:$dp" "sdk-dependency-audit:$sa" "example-java-manifest-audit:$ea" "sdk-tests:$st" "sdk-python-tests:$spt" "pr-review-input-guard:$pg" "changes:$ch"; do
            if [ "${pair#*:}" != "success" ]; then
              echo "::error::${pair%%:*} did not succeed (${pair#*:}); failing closed."
              fail=1
            fi
          done
          # Path-filtered jobs pass on success or skip; failure/cancel fails.
          for pair in "backend:$be" "integration:$it" "atx-conformance:$ax" "frontend:$fe" "e2e-empty-state:$ee"; do
            r="${pair#*:}"
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::${pair%%:*} failed or was cancelled ($r)."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "CI Gate: all jobs green (or legitimately skipped)."

  # End-to-end Playwright suite covering empty-state rendering on every
  # dashboard panel of the agent and MCP server detail pages — the binding
  # ☐ in HARDENING.md#roadmap-to-1-0. Boots a real Postgres + Go backend
  # so every test exercises a freshly-created resource through the
  # actual API contract; no mocked routes, no pre-seeded fixtures.
  e2e-empty-state:
    name: E2E empty-state (Playwright)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aim
          POSTGRES_PASSWORD: aim
          POSTGRES_DB: aim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aim -d aim_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # cmd/migrate + cmd/bootstrap consume DATABASE_URL directly.
      DATABASE_URL: postgres://aim:aim@localhost:5432/aim_test?sslmode=disable
      # cmd/server consumes discrete POSTGRES_* vars (see internal/config/config.go).
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: aim
      POSTGRES_PASSWORD: aim
      POSTGRES_DB: aim_test
      POSTGRES_SSL_MODE: disable
      # ENVIRONMENT=test (NOT "ci") so rate_limit.go:62 honors the 10x bump
      # — StrictRateLimitMiddleware caps /login/local at 10 req/min in any
      # un-recognized environment, and the e2e suite needs more than that
      # even with worker-scoped auth + retries. The "test" string is also
      # safe against the other ENVIRONMENT checks (security_headers and
      # cookie Secure-flag only branch on "production"; detection_service
      # only on "development"/"dev").
      ENVIRONMENT: test
      NEXT_PUBLIC_API_URL: http://localhost:8080
      AIM_TEST_ADMIN_EMAIL: admin@opena2a.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps

      - name: Generate ephemeral CI secrets
        run: |
          # JWT_SECRET is consumed as raw string, ≥32 chars, not a known-dev
          # value (config.go:212-222). A 64-char hex string is fine.
          #
          # KEYVAULT_MASTER_KEY is base64-decoded by keyvault.go:28 and the
          # decoded bytes must be exactly 32 (AES-256). The matching openssl
          # incantation — quoted verbatim in config.go:225 — is rand -base64 32.
          # `rand -hex 32` would decode as base64 to 48 bytes and fail.
          #
          # DEFAULT_ADMIN_PASSWORD must satisfy bootstrap's 4-class complexity
          # rule (password.go:24); the base64 stem stripped of /+= covers
          # upper+lower+digit and the fixed Aa1! suffix pins the special class.
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "KEYVAULT_MASTER_KEY=$(openssl rand -base64 32)"
            ADMIN_PW="$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)Aa1!"
            echo "DEFAULT_ADMIN_PASSWORD=${ADMIN_PW}"
            echo "AIM_TEST_ADMIN_PASSWORD=${ADMIN_PW}"
          } >> "$GITHUB_ENV"

      - name: Build backend binaries
        working-directory: apps/backend
        run: |
          go build -o /tmp/aim-server ./cmd/server
          go build -o /tmp/aim-migrate ./cmd/migrate
          go build -o /tmp/aim-bootstrap ./cmd/bootstrap

      # cmd/migrate (and cmd/server's startup migration loop) read the
      # migrations/ directory via a relative path, so the working directory
      # must be apps/backend where that directory lives. bootstrap doesn't
      # touch the filesystem but is run from the same cwd for parity.
      - name: Run migrations
        working-directory: apps/backend
        run: /tmp/aim-migrate

      - name: Seed canonical admin
        working-directory: apps/backend
        run: /tmp/aim-bootstrap --default

      - name: Start backend
        working-directory: apps/backend
        run: |
          /tmp/aim-server > /tmp/aim-server.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend /health/ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then
              echo "✓ backend ready (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "✗ backend did not become ready within 60s"
          echo "=== backend log ==="
          cat /tmp/aim-server.log || true
          exit 1

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright empty-state suite
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/aim-server.log
          retention-days: 14
