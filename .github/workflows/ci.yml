name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter lists PR files via the REST API on pull_request
  # events (the checkout only serves push-event detection). That API call
  # succeeds without this permission only because the repo is public; if
  # visibility ever changes it 403s, the changes job fails, and the gate
  # fails closed — wedging every PR. Keep the permission explicit.
  pull-requests: read

jobs:
  # Reject ${VAR:-fallback} patterns for secret-shaped env vars in any
  # docker-compose*.yml. Catches the CWE-798 regression that shipped to main
  # multiple times before — see scripts/lint-no-secret-fallbacks.sh for the
  # closed set of names enforced. Unconditional (no path filter) because the
  # script is sub-second and the failure mode is silent if it ever stops running.
  secrets-lint:
    name: Compose secret-fallback lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No ${VAR:-fallback} for secret-shaped env vars
        run: ./scripts/lint-no-secret-fallbacks.sh

  # AST lint that catches HTTP handlers reading c.Params("id"|"agent_id")
  # without invoking the tenant-scoping helper (LoadOwned or
  # LoadOwnedViaAgent). The structural guarantee for the defect #18-25
  # cluster — a future handler that forgets tenant scoping fails CI before
  # merge. Pre-existing handlers without the helper are allowlisted (see
  # cmd/tenantscope-lint/main.go) and tracked for systematic follow-up.
  tenant-scoping-lint:
    name: Tenant-scoping lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum
      - name: No handler reads :id without LoadOwned
        run: ./scripts/lint-tenant-scoping.sh

  # Detect which parts of the monorepo changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # ci.yml is in both filters: a PR that edits this workflow must
            # run the full suite under the edited workflow, not skip it.
            # Root package.json/package-lock.json feed apps/web via npm
            # workspaces (apps/web has no lockfile of its own) — a root dep
            # bump that skipped the frontend build would merge unvalidated.
            backend:
              - 'apps/backend/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            # ATX credential paths gated by the pinned atx-conformance suite:
            # the Java LocalAtxVerifier (+ its vendored fixtures) and the Go
            # issuance client whose Raw pass-through must stay byte-preserving.
            conformance:
              - 'sdk/java/**'
              - 'apps/backend/internal/infrastructure/registry/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: jsonarray-lint (null-array regression guard)
        run: |
          LINT_TMP=$(mktemp -d -t jsonarray-lint.XXXXXX)
          trap 'rm -rf "$LINT_TMP"' EXIT
          go build -o "$LINT_TMP/jsonarray-lint" ./cmd/jsonarray-lint/
          "$LINT_TMP/jsonarray-lint" \
            internal/interfaces/http/handlers \
            internal/infrastructure/repository \
            internal/application

      - name: Test with coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Check coverage thresholds
        run: |
          check_coverage() {
            local pkg_pattern="$1"
            local min_pct="$2"
            local label="$3"

            # Extract coverage for matching packages
            local pct
            pct=$(grep "$pkg_pattern" coverage.txt \
              | awk '{print $NF}' \
              | sed 's/%//' \
              | awk '{ sum += $1; n++ } END { if (n > 0) printf "%.1f", sum/n; else print "0" }')

            if [ -z "$pct" ] || [ "$pct" = "0" ]; then
              echo "⚠ $label: no coverage data found (pattern: $pkg_pattern)"
              return 0
            fi

            local pass
            pass=$(echo "$pct >= $min_pct" | bc -l)
            if [ "$pass" -eq 1 ]; then
              echo "✓ $label: ${pct}% (minimum: ${min_pct}%)"
            else
              echo "✗ $label: ${pct}% is below minimum ${min_pct}%"
              return 1
            fi
          }

          FAILED=0
          check_coverage "internal/domain" 90 "Domain layer" || FAILED=1
          check_coverage "internal/crypto/pqc" 85 "PQC crypto" || FAILED=1
          check_coverage "internal/crypto" 75 "Crypto layer" || FAILED=1
          check_coverage "internal/infrastructure/auth" 60 "Auth layer" || FAILED=1

          # Overall coverage (30% minimum — cmd/ and infra/ have 0% which drags average)
          TOTAL=$(grep "^total:" coverage.txt | awk '{print $NF}' | sed 's/%//')
          if [ -n "$TOTAL" ]; then
            PASS=$(echo "$TOTAL >= 30" | bc -l)
            if [ "$PASS" -eq 1 ]; then
              echo "✓ Overall: ${TOTAL}% (minimum: 30%)"
            else
              echo "✗ Overall: ${TOTAL}% is below minimum 30%"
              FAILED=1
            fi
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage.out

  # Conformance gate: AIM's ATX credential paths must accept/reject exactly
  # what the pinned opena2a-standards/atx-conformance fixtures say (the suite
  # the Go/Python reference verifiers and @opena2a/atx-verify are gated on).
  # Two paths are gated here:
  #   1. sdk/java LocalAtxVerifier — runs the conformance fixture set (vendored
  #      copies, byte-checked against the pinned suite below so they cannot
  #      silently drift).
  #   2. apps/backend Go issuance client — replays every pinned credential as
  #      a Registry response and asserts the signed bytes survive AIM's
  #      issuance path unmodified (Raw pass-through byte-match).
  atx-conformance:
    name: ATX conformance
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    env:
      # Pinned suite ref. Bump deliberately when the suite grows; the vendored
      # Java fixture copies must be refreshed in the same PR or the drift gate
      # below fails.
      ATX_CONFORMANCE_REF: b2de78387e5b9e70af5efbef28f46e7732016c82
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned atx-conformance suite
        run: |
          git clone --no-checkout https://github.com/opena2a-standards/atx-conformance.git /tmp/atx-conformance
          git -C /tmp/atx-conformance checkout "$ATX_CONFORMANCE_REF"

      - name: MANIFEST.sha256 integrity
        working-directory: /tmp/atx-conformance
        run: |
          rc=0
          while read -r sha file; do
            [ -z "$sha" ] && continue
            got=$(sha256sum "$file" | awk '{print $1}')
            if [ "$got" != "$sha" ]; then
              echo "::error::MANIFEST mismatch: $file"; rc=1
            fi
          done < MANIFEST.sha256
          exit $rc

      - name: Vendored Java fixtures byte-match the pinned suite
        run: |
          fail=0
          for f in /tmp/atx-conformance/fixtures/*.json; do
            b=$(basename "$f")
            if ! cmp -s "$f" "sdk/java/src/test/resources/atx-fixtures/$b"; then
              echo "::error::vendored fixture $b is missing or drifted from the pinned suite"
              fail=1
            fi
          done
          for f in sdk/java/src/test/resources/atx-fixtures/*.json; do
            b=$(basename "$f")
            if [ ! -f "/tmp/atx-conformance/fixtures/$b" ]; then
              echo "::error::vendored fixture $b does not exist in the pinned suite"
              fail=1
            fi
          done
          exit $fail

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      # Scoped to the atx package: the SDK's Live/RealWorld integration tests
      # need a live backend and credentials that CI does not have.
      - name: Java LocalAtxVerifier vs pinned fixtures
        working-directory: sdk/java
        run: mvn -B test -Dtest='org.opena2a.aim.atx.*Test'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      - name: Go issuance byte-match vs pinned fixtures
        working-directory: apps/backend
        env:
          ATX_CONFORMANCE_DIR: /tmp/atx-conformance/fixtures
        run: go test ./internal/infrastructure/registry/ -run TestATCIssuance_ConformanceByteMatch -v

  frontend:
    name: Frontend (Next.js)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        run: npm run build

  # Fan-in gate so branch protection can require ONE check that always
  # reports. The path-filtered jobs (backend/frontend/e2e) legitimately skip
  # when nothing relevant changed — a skip counts as a pass here — but a
  # required check pointed directly at them would sit forever on
  # "Expected — waiting for status" for PRs that don't touch code.
  # Change-detection itself MUST succeed; otherwise the expensive jobs were
  # skipped for the wrong reason and a code change could slip through
  # untested — fail closed. New jobs added to this workflow must be added to
  # `needs` below or the gate silently stops covering them. This job must
  # keep `if: always()` and the workflow must never gain a top-level
  # `paths:` filter — GitHub counts a skipped or never-reported required
  # check as satisfied or wedges the PR, respectively.
  ci-gate:
    name: CI Gate
    needs:
      [
        secrets-lint,
        tenant-scoping-lint,
        changes,
        backend,
        atx-conformance,
        frontend,
        e2e-empty-state,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          sl='${{ needs.secrets-lint.result }}'
          tl='${{ needs.tenant-scoping-lint.result }}'
          ch='${{ needs.changes.result }}'
          be='${{ needs.backend.result }}'
          ax='${{ needs.atx-conformance.result }}'
          fe='${{ needs.frontend.result }}'
          ee='${{ needs.e2e-empty-state.result }}'
          echo "secrets-lint=$sl tenant-scoping-lint=$tl changes=$ch"
          echo "backend=$be atx-conformance=$ax frontend=$fe e2e-empty-state=$ee"
          fail=0
          # Unconditional jobs must succeed outright.
          for pair in "secrets-lint:$sl" "tenant-scoping-lint:$tl" "changes:$ch"; do
            if [ "${pair#*:}" != "success" ]; then
              echo "::error::${pair%%:*} did not succeed (${pair#*:}); failing closed."
              fail=1
            fi
          done
          # Path-filtered jobs pass on success or skip; failure/cancel fails.
          for pair in "backend:$be" "atx-conformance:$ax" "frontend:$fe" "e2e-empty-state:$ee"; do
            r="${pair#*:}"
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::${pair%%:*} failed or was cancelled ($r)."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "CI Gate: all jobs green (or legitimately skipped)."

  # End-to-end Playwright suite covering empty-state rendering on every
  # dashboard panel of the agent and MCP server detail pages — the binding
  # ☐ in HARDENING.md#roadmap-to-1-0. Boots a real Postgres + Go backend
  # so every test exercises a freshly-created resource through the
  # actual API contract; no mocked routes, no pre-seeded fixtures.
  e2e-empty-state:
    name: E2E empty-state (Playwright)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aim
          POSTGRES_PASSWORD: aim
          POSTGRES_DB: aim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aim -d aim_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # cmd/migrate + cmd/bootstrap consume DATABASE_URL directly.
      DATABASE_URL: postgres://aim:aim@localhost:5432/aim_test?sslmode=disable
      # cmd/server consumes discrete POSTGRES_* vars (see internal/config/config.go).
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: aim
      POSTGRES_PASSWORD: aim
      POSTGRES_DB: aim_test
      POSTGRES_SSL_MODE: disable
      # ENVIRONMENT=test (NOT "ci") so rate_limit.go:62 honors the 10x bump
      # — StrictRateLimitMiddleware caps /login/local at 10 req/min in any
      # un-recognized environment, and the e2e suite needs more than that
      # even with worker-scoped auth + retries. The "test" string is also
      # safe against the other ENVIRONMENT checks (security_headers and
      # cookie Secure-flag only branch on "production"; detection_service
      # only on "development"/"dev").
      ENVIRONMENT: test
      NEXT_PUBLIC_API_URL: http://localhost:8080
      AIM_TEST_ADMIN_EMAIL: admin@opena2a.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps

      - name: Generate ephemeral CI secrets
        run: |
          # JWT_SECRET is consumed as raw string, ≥32 chars, not a known-dev
          # value (config.go:212-222). A 64-char hex string is fine.
          #
          # KEYVAULT_MASTER_KEY is base64-decoded by keyvault.go:28 and the
          # decoded bytes must be exactly 32 (AES-256). The matching openssl
          # incantation — quoted verbatim in config.go:225 — is rand -base64 32.
          # `rand -hex 32` would decode as base64 to 48 bytes and fail.
          #
          # DEFAULT_ADMIN_PASSWORD must satisfy bootstrap's 4-class complexity
          # rule (password.go:24); the base64 stem stripped of /+= covers
          # upper+lower+digit and the fixed Aa1! suffix pins the special class.
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "KEYVAULT_MASTER_KEY=$(openssl rand -base64 32)"
            ADMIN_PW="$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)Aa1!"
            echo "DEFAULT_ADMIN_PASSWORD=${ADMIN_PW}"
            echo "AIM_TEST_ADMIN_PASSWORD=${ADMIN_PW}"
          } >> "$GITHUB_ENV"

      - name: Build backend binaries
        working-directory: apps/backend
        run: |
          go build -o /tmp/aim-server ./cmd/server
          go build -o /tmp/aim-migrate ./cmd/migrate
          go build -o /tmp/aim-bootstrap ./cmd/bootstrap

      # cmd/migrate (and cmd/server's startup migration loop) read the
      # migrations/ directory via a relative path, so the working directory
      # must be apps/backend where that directory lives. bootstrap doesn't
      # touch the filesystem but is run from the same cwd for parity.
      - name: Run migrations
        working-directory: apps/backend
        run: /tmp/aim-migrate

      - name: Seed canonical admin
        working-directory: apps/backend
        run: /tmp/aim-bootstrap --default

      - name: Start backend
        working-directory: apps/backend
        run: |
          /tmp/aim-server > /tmp/aim-server.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend /health/ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then
              echo "✓ backend ready (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "✗ backend did not become ready within 60s"
          echo "=== backend log ==="
          cat /tmp/aim-server.log || true
          exit 1

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright empty-state suite
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/aim-server.log
          retention-days: 14
