name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Generate Go SBOM (CycloneDX)
        working-directory: apps/backend
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -json -output ../../sbom-backend.cdx.json

      - name: Generate Frontend SBOM (CycloneDX)
        run: |
          npm ci
          npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom-frontend.cdx.json

      - name: Upload SBOMs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json
