name: Release

on:
  push:
    tags:
      # Per-artifact tag prefixes per CONTRIBUTING.md "Tag conventions"
      # (introduced in PR #249). Each prefix gates a different job below.
      - "platform-v*"   # SBOM job (backend + frontend)
      - "sdk-py-v*"     # PyPI publish for aim-sdk (Python)
      - "sdk-ts-v*"     # npm publish for @opena2a/aim-sdk (TypeScript)
      - "sdk-java-v*"   # Maven Central publish for org.opena2a:aim-sdk (Java)

permissions:
  contents: write

jobs:
  sbom:
    name: Generate SBOMs
    # SBOM job is platform-scoped; skip on per-SDK tag pushes.
    if: startsWith(github.ref, 'refs/tags/platform-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Generate Go SBOM (CycloneDX)
        working-directory: apps/backend
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -json -output ../../sbom-backend.cdx.json

      - name: Generate Frontend SBOM (CycloneDX)
        run: |
          npm ci
          npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom-frontend.cdx.json

      - name: Upload SBOMs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json

  # Publishes the Python aim-sdk to PyPI on an `aim-sdk-v<version>` tag
  # push, using PyPI Trusted Publishing (OIDC). No long-lived token in
  # the workflow or in repo secrets — the OIDC token issued to this job
  # is exchanged at the registry, per global CLAUDE.md "npm Publish
  # (MANDATORY — Trusted Publishing via OIDC)" applied to PyPI.
  #
  # First publish under this job requires PyPI Trusted Publishers to be
  # configured for `aim-sdk` (Account → Publishing on pypi.org; owner=
  # opena2a-org, repo=agent-identity-management, workflow=release.yml,
  # environment=blank). Without that configuration the OIDC exchange
  # fails cleanly with "OIDC token verification failed".
  publish-python:
    name: Publish aim-sdk to PyPI
    if: startsWith(github.ref, 'refs/tags/sdk-py-v')
    runs-on: ubuntu-latest
    permissions:
      # id-token: write is the OIDC trust handshake the registry verifies.
      # contents: read is enough — no commits or releases written from here.
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches VERSION
        run: |
          # The tag is sdk-py-v<X.Y.Z>; the VERSION file is <X.Y.Z>.
          TAG_VERSION="${GITHUB_REF_NAME#sdk-py-v}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "✗ Tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)"
            echo "  Either the tag was pushed without bumping VERSION, or VERSION was bumped"
            echo "  but the tag uses a different value. Fix one before re-tagging."
            exit 1
          fi
          echo "✓ Tag and VERSION agree on ${TAG_VERSION}"

      - name: Skip if version already on PyPI
        id: idempotence
        run: |
          # Per-publish idempotence: a re-tag (e.g. workflow re-run) must not
          # error the job just because the version exists. The pypa publish
          # action errors loudly on duplicate version uploads; we short-circuit
          # cleanly here instead.
          VERSION="$(cat VERSION)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/aim-sdk/${VERSION}/json")
          if [ "$STATUS" = "200" ]; then
            echo "ℹ️  aim-sdk ${VERSION} is already on PyPI — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "✓ aim-sdk ${VERSION} not yet on PyPI; will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist + wheel
        if: steps.idempotence.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.idempotence.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

      - name: Verify publish
        if: steps.idempotence.outputs.skip != 'true'
        run: |
          VERSION="$(cat VERSION)"
          # Brief retry — registry indexing can lag a few seconds after upload.
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/aim-sdk/${VERSION}/json")
            if [ "$STATUS" = "200" ]; then
              echo "✓ aim-sdk ${VERSION} is live on PyPI"
              exit 0
            fi
            sleep 5
          done
          echo "✗ aim-sdk ${VERSION} not visible on PyPI after publish — investigate"
          exit 1

  # Publishes the TypeScript @opena2a/aim-sdk to npm on an
  # `sdk-ts-v<version>` tag push, using npm Trusted Publishing (OIDC).
  # No long-lived token in the workflow or in repo secrets — the OIDC
  # token issued to this job is exchanged at the registry.
  #
  # First publish under this job requires npm Trusted Publishing to be
  # configured for @opena2a/aim-sdk on npmjs.com (Package settings →
  # Publishing access → Trusted Publisher → GitHub Actions; owner=
  # opena2a-org, repo=agent-identity-management, workflow=release.yml,
  # environment=blank). The package name is unclaimed on npm as of this
  # PR; the org admin needs to reserve it as part of the TP config flow.
  publish-npm:
    name: Publish @opena2a/aim-sdk to npm
    if: startsWith(github.ref, 'refs/tags/sdk-ts-v')
    runs-on: ubuntu-latest
    permissions:
      # id-token: write is the OIDC trust handshake. contents: read is
      # enough — no commits or releases written from here.
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      # Node 24 is the minimum that ships an npm new enough to do the
      # OIDC handshake against npmjs.com per the org TP rollout (global
      # CLAUDE.md "Node 24 minimum for setup-node@v4"). Older Node + npm
      # will fall back to token auth and fail.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Verify tag matches package.json version
        run: |
          # Tag is sdk-ts-v<X.Y.Z>; package.json "version" is <X.Y.Z>.
          TAG_VERSION="${GITHUB_REF_NAME#sdk-ts-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "✗ Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            echo "  Either the tag was pushed without bumping package.json, or"
            echo "  package.json was bumped but the tag uses a different value."
            exit 1
          fi
          echo "✓ Tag and package.json agree on ${TAG_VERSION}"

      - name: Skip if version already on npm
        id: idempotence
        run: |
          # Per-publish idempotence: a re-tag must not error the job just
          # because the version exists. `npm publish` on a duplicate version
          # errors loudly; this short-circuits cleanly instead.
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@opena2a/aim-sdk@${VERSION}" version > /dev/null 2>&1; then
            echo "ℹ️  @opena2a/aim-sdk@${VERSION} is already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "✓ @opena2a/aim-sdk@${VERSION} not yet on npm; will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.idempotence.outputs.skip != 'true'
        run: npm ci

      - name: Build
        if: steps.idempotence.outputs.skip != 'true'
        # tsup build (per package.json scripts.build). prepublishOnly also
        # runs build but explicit here for fail-fast on build errors.
        run: npm run build

      - name: Publish to npm with provenance
        if: steps.idempotence.outputs.skip != 'true'
        # --provenance is technically redundant under Trusted Publishing
        # (it's implicit) but kept explicit per global CLAUDE.md.
        # --access public is required for scoped packages on a public
        # registry the first time they publish.
        run: npm publish --provenance --access public

      - name: Verify publish
        if: steps.idempotence.outputs.skip != 'true'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Brief retry — registry indexing can lag a few seconds.
          for i in 1 2 3 4 5; do
            if npm view "@opena2a/aim-sdk@${VERSION}" version > /dev/null 2>&1; then
              echo "✓ @opena2a/aim-sdk@${VERSION} is live on npm"
              # Provenance check: dist.attestations must be non-empty
              # under Trusted Publishing. Empty means the publish went
              # through without OIDC (unexpected) — flag it.
              ATTEST=$(npm view "@opena2a/aim-sdk@${VERSION}" dist.attestations --json 2>/dev/null || echo "")
              if [ -z "$ATTEST" ] || [ "$ATTEST" = "null" ]; then
                echo "⚠  Published but dist.attestations is empty — provenance NOT attached."
                exit 1
              fi
              echo "✓ SLSA provenance attached"
              exit 0
            fi
            sleep 5
          done
          echo "✗ @opena2a/aim-sdk@${VERSION} not visible on npm after publish — investigate"
          exit 1

  # Publishes the Java org.opena2a:aim-sdk to Maven Central on an
  # `sdk-java-v<version>` tag push.
  #
  # Unlike PyPI and npm, Maven Central has no OIDC Trusted Publishing
  # (as of 2026-05). Authentication uses a username/password token pair
  # from central.sonatype.com, stored as repo secrets. Artifacts must
  # be GPG-signed; the GPG private key + passphrase are also repo
  # secrets. The central-publishing-maven-plugin (sdk/java/pom.xml
  # release profile) talks to central.sonatype.com's portal API and
  # auto-releases the staged bundle.
  #
  # Required repo secrets (see PR body for setup):
  #   MAVEN_CENTRAL_USERNAME   sonatype portal token user (NOT JIRA login)
  #   MAVEN_CENTRAL_PASSWORD   sonatype portal token value
  #   MAVEN_GPG_PRIVATE_KEY    ASCII-armored GPG private key
  #   MAVEN_GPG_PASSPHRASE     passphrase for the GPG key
  publish-java:
    name: Publish org.opena2a:aim-sdk to Maven Central
    if: startsWith(github.ref, 'refs/tags/sdk-java-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4

      # setup-java@v4 wires up settings.xml with the `central` server
      # credentials and imports the GPG key so the maven-gpg-plugin can
      # sign every artifact in the verify phase. The server-id here must
      # match <distributionManagement><repository><id> in pom.xml.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          cache: maven

      - name: Verify tag matches pom.xml version
        run: |
          # Tag is sdk-java-v<X.Y.Z>; pom.xml <version> is <X.Y.Z>.
          TAG_VERSION="${GITHUB_REF_NAME#sdk-java-v}"
          POM_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "✗ Tag version ($TAG_VERSION) does not match pom.xml ($POM_VERSION)"
            echo "  Either the tag was pushed without bumping pom.xml, or pom.xml"
            echo "  was bumped but the tag uses a different value. Fix one before"
            echo "  re-tagging."
            exit 1
          fi
          echo "✓ Tag and pom.xml agree on ${TAG_VERSION}"

      - name: Skip if version already on Maven Central
        id: idempotence
        run: |
          # Per-publish idempotence: a re-tag must not error the job just
          # because the version is already published. Central's
          # central-publishing-maven-plugin errors loudly on duplicate
          # uploads; this short-circuits cleanly instead. Check repo1
          # (the production CDN) since central.sonatype.com is the upload
          # endpoint, not the read endpoint.
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          URL="https://repo1.maven.org/maven2/org/opena2a/aim-sdk/${VERSION}/aim-sdk-${VERSION}.pom"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" = "200" ]; then
            echo "ℹ️  org.opena2a:aim-sdk:${VERSION} is already on Maven Central — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "✓ org.opena2a:aim-sdk:${VERSION} not yet on Maven Central; will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + sign + deploy to Central
        if: steps.idempotence.outputs.skip != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        # -P release activates GPG signing + central-publishing-maven-plugin
        # autoPublish handles staging+release in one shot.
        run: mvn -B -P release deploy

      - name: Verify publish
        if: steps.idempotence.outputs.skip != 'true'
        run: |
          # Central's CDN sync can take several minutes after autoPublish.
          # We give it a generous window before declaring failure.
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          URL="https://repo1.maven.org/maven2/org/opena2a/aim-sdk/${VERSION}/aim-sdk-${VERSION}.pom"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "✓ org.opena2a:aim-sdk:${VERSION} is live on Maven Central"
              exit 0
            fi
            sleep 20
          done
          echo "✗ org.opena2a:aim-sdk:${VERSION} not visible on Maven Central after 10min"
          echo "  Bundle may be stuck in the portal — check central.sonatype.com"
          exit 1
