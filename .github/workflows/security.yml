name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  go-security-scan:
    name: Go Security Scan (SAST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/backend/go.sum

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: -fmt sarif -out gosec-results.sarif -exclude-dir=vendor ./...
          working-directory: apps/backend

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: apps/backend/gosec-results.sarif
          category: gosec

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Trivy filesystem scan (Go)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: apps/backend
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Trivy filesystem scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: apps/web
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: npm audit
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  container-scan:
    name: Container Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infrastructure/docker/Dockerfile.backend
            context: .
          - image: frontend
            dockerfile: infrastructure/docker/Dockerfile.frontend
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t aim-${{ matrix.image }}:scan \
            ${{ matrix.context }}

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aim-${{ matrix.image }}:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  crypto-audit:
    name: Crypto Best Practices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run crypto audit
        run: |
          chmod +x scripts/crypto-audit.sh
          ./scripts/crypto-audit.sh

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Check Go licenses
        working-directory: apps/backend
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... --disallowed_types=restricted,reciprocal 2>&1 | tee license-report.txt
          # Fail on GPL/AGPL/SSPL
          if grep -iE 'GPL|AGPL|SSPL' license-report.txt | grep -iv 'LGPL'; then
            echo "::error::Copyleft license detected in Go dependencies"
            exit 1
          fi

      - name: Check npm licenses
        working-directory: apps/web
        run: |
          npm ci
          npx license-checker --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;SSPL-1.0" --summary

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: apps/backend
          args: --config ../../.golangci.yml
