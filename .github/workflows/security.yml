name: Security Pipeline

# Trigger strategy:
#   PR to main  → full scan (merge gate — nothing lands without passing)
#   Push to main → lightweight checks only (secret scan + dependency audit)
#   Weekly       → full scan (catches newly disclosed CVEs in dependencies)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Detect what changed so heavy jobs can be skipped when irrelevant
  changes:
    name: Detect Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      go_deps: ${{ steps.filter.outputs.go_deps }}
      npm_deps: ${{ steps.filter.outputs.npm_deps }}
      crypto: ${{ steps.filter.outputs.crypto }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            frontend:
              - 'apps/web/**'
            # Derived from what the Dockerfiles COPY, not maintained beside
            # them. `scripts/lint-docker-paths-filter.sh` fails CI if a COPY
            # source stops being covered, because maintaining this list by hand
            # drifted twice: #389 (ci.yml missed sdk/**) and #398 (this filter
            # missed sdk/**, apps/backend/** and apps/web/**). Both were
            # invisible in review, since a skipped job satisfies a required
            # status check and the PR reads green with the image never scanned.
            #
            # Dockerfile.backend  COPY: apps/backend/, apps/backend/go.mod,
            #                           apps/backend/migrations, sdk
            # Dockerfile.frontend COPY: apps/web/, apps/web/package.json
            #
            # security.yml is in its own filter for the reason ci.yml states for
            # ci.yml: a PR that edits this filter must run the container scan
            # UNDER the edited filter, not under the old one. Without it, the
            # change that widens or narrows this list is the one change the list
            # never governs.
            docker:
              - 'infrastructure/docker/**'
              - 'apps/backend/**'
              - 'apps/web/**'
              - 'sdk/**'
              - '.github/workflows/security.yml'
            # Split out of a single `deps` filter that listed the Go module
            # files BESIDE apps/web's manifests. License Compliance has two
            # steps reading two ecosystems, so one filter gated both: a pull
            # request whose only change was apps/web/package-lock.json ran the
            # Go check, and the transient module-proxy error it hit there
            # reported as a license failure (#493). Each step is gated on its
            # own inputs now.
            #
            # scripts/go-licenses-check.sh is a go_deps input for the reason
            # given above for security.yml itself: the script IS the Go step's
            # logic, so a pull request that edits it must run the step UNDER
            # the edited script, not under the old one.
            go_deps:
              - 'apps/backend/go.mod'
              - 'apps/backend/go.sum'
              - 'apps/backend/**/*.go'
              - '.github/workflows/security.yml'
              - 'scripts/go-licenses-check.sh'
            npm_deps:
              - 'apps/web/package.json'
              - 'apps/web/package-lock.json'
              - '.github/workflows/security.yml'
            crypto:
              - 'apps/backend/internal/crypto/**'
              - 'apps/backend/internal/infrastructure/auth/**'
              - 'scripts/crypto-audit.sh'

  # ── Always-run jobs (PR + push + schedule) ─────────────────────────

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    # We dogfood our own scanner. HackMyAgent's quick-mode scan
    # (config + creds) is a superset of what gitleaks gave us: same
    # credential pattern coverage, plus MCP config integrity and
    # governance checks. Single source of truth for credential
    # detection across the CLI (`opena2a scan` / `opena2a protect`),
    # the local pre-push gate (Phase 4), and this CI pipeline.
    # Intentional placeholder files (e.g. .env.example) are
    # allowlisted via .hmaignore at the repo root.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run HackMyAgent secret + credential scan
        # --scan-depth quick     : config + creds only (gitleaks-equivalent scope)
        # --static-only          : disable NanoMind semantic analysis for
        #                          deterministic, GPU-free CI runs.
        # --fail-below 90        : fail on net HIGH/CRITICAL findings;
        #                          baseline today is 100/100 with the
        #                          .env.example allowlist + .gitleaks.toml
        #                          deletion landed.
        run: npx hackmyagent@latest secure . --ci --scan-depth quick --static-only --fail-below 90

  # ADVISORY ONLY — this job cannot fail, by construction. Both Trivy steps pass
  # `exit-code: 0` and the npm audit ends in `|| true`, so a green "Dependency Audit"
  # on a pull request means "the job ran", NOT "no advisories were found". Read the
  # step logs; do not read the check mark.
  #
  # This is not hypothetical. It reported SUCCESS on every PR for the whole period in
  # which sdk/typescript shipped js-yaml 4.3.0 (GHSA-5p4m-2wfm-xmqj, HIGH) — which it
  # would not have caught in any case, because it only scans apps/web and never reads
  # sdk/. The advisory was eventually found downstream by aim-cloud's Trivy on a sync
  # pull request, after the vulnerable floor was already being carried into the hosted
  # product.
  #
  # The BLOCKING counterpart is `sdk-dependency-audit` in ci.yml, wired into CI Gate.
  # Leaving this job advisory is deliberate — making its steps blocking today would
  # turn main red on 4 pre-existing production highs in the root tree (next, sharp,
  # postcss, nanoid) plus dev-only findings in apps/web. Resolve those, then promote
  # these steps rather than adding more advisory ones.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Trivy filesystem scan (Go)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: apps/backend
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Trivy filesystem scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: apps/web
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: npm audit
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high || true

  # ── PR-only / schedule-only jobs (merge gate + weekly) ─────────────

  go-security-scan:
    name: Go Security Scan (SAST)
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif -exclude-dir=vendor ./... || true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: apps/backend/gosec-results.sarif
          category: gosec

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

  container-scan:
    name: Container Scan (${{ matrix.image }})
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infrastructure/docker/Dockerfile.backend
            context: .
          - image: frontend
            dockerfile: infrastructure/docker/Dockerfile.frontend
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t aim-${{ matrix.image }}:scan \
            ${{ matrix.context }}

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aim-${{ matrix.image }}:scan
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table

  crypto-audit:
    name: Crypto Best Practices
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.crypto == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run crypto audit
        run: |
          chmod +x scripts/crypto-audit.sh
          ./scripts/crypto-audit.sh

  license-check:
    name: License Compliance
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
      (needs.changes.outputs.go_deps == 'true' ||
      needs.changes.outputs.npm_deps == 'true'))
    runs-on: ubuntu-latest
    env:
      # go-licenses v2.0.1 was released 2025-09-08; this version and its h1
      # sum were measured 2026-09-17 from sum.golang.org. The sum is asserted
      # on the INSTALLED binary by scripts/go-licenses-check.sh (via
      # `go version -m`) before the checker is allowed to run, so a
      # substituted build fails the step instead of scanning. The step
      # previously installed `@latest` from the v1 module path, which silently
      # meant v1.6.0 of 2023-01-18 and left no record of what had run.
      GO_LICENSES_VERSION: v2.0.1
      GO_LICENSES_SUM: h1:ti+9bi5o7DKbeeg5eBb/uZTgsaPNoJaLCh93cRcXsW8=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The verdict is this step's exit status, which is the script's, which is
      # the checker's. No pipe, no tee, no grep: the step used to pipe the
      # checker into `tee` — discarding its exit status, since this file sets
      # no pipefail — and then decide pass or fail by grepping the report for
      # GPL|AGPL|SSPL, which let through every restricted or reciprocal
      # license not spelled that way and dropped any line naming both LGPL and
      # AGPL. Classifying a FAILURE is the script's job; text never decides
      # the verdict. See scripts/go-licenses-check.sh for the class set and
      # the six summary phrases.
      - name: Check Go licenses
        if: github.event_name == 'schedule' || needs.changes.outputs.go_deps == 'true'
        run: ./scripts/go-licenses-check.sh

      - name: Check npm licenses
        if: github.event_name == 'schedule' || needs.changes.outputs.npm_deps == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npx license-checker --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;SSPL-1.0" --summary

  # The security linters (gosec audit mode, bodyclose, sqlclosecheck) are BLOCKING: this
  # is the class we cannot ship regressions in. The broader quality linters (staticcheck,
  # unused) run as a separate NON-BLOCKING job while their pre-existing backlog is burned
  # down. action@v8 installs golangci-lint v2 (the v6 line caps at v1, whose binary is
  # built on go1.24 and refuses our go1.25 target); pin the linter explicitly so CI and
  # local runs use the identical build. Both jobs share one .golangci.yml; the linter set
  # is selected per job via --default=none --enable=... (security) vs the full config.
  # NOTE: no job-level `if`. This job ALWAYS runs on a PR so it can be a required
  # branch-protection check without wedging PRs that don't touch the backend — a
  # required check that is skipped at the job level never reports a conclusion and
  # blocks the PR forever. The lint steps below are gated on backend changes; when
  # the backend is untouched every step skips and the job concludes success (a
  # no-op), which is what makes it safe to require.
  go-lint-security:
    name: Go Lint (security)
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.backend == 'true'

      - uses: actions/setup-go@v5
        if: needs.changes.outputs.backend == 'true'
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      - name: Run golangci-lint (security linters, blocking)
        if: needs.changes.outputs.backend == 'true'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: apps/backend
          args: --config ../../.golangci.yml --default=none --enable=gosec,bodyclose,sqlclosecheck

  go-lint-quality:
    name: Go Lint (quality)
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum

      - name: Run golangci-lint (full set, non-blocking)
        # NON-BLOCKING: staticcheck/unused carry a pre-existing 166-finding backlog.
        # Findings post as inline PR annotations so they stay visible; this job is made
        # blocking once the backlog reaches zero. Tracked in
        # todo/2026-06-26-aim-golangci-lint-silently-disabled.md.
        uses: golangci/golangci-lint-action@v8
        continue-on-error: true
        with:
          version: v2.12.2
          working-directory: apps/backend
          args: --config ../../.golangci.yml
